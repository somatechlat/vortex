[workspace]
members = [
    "crates/vortex-core",
    "crates/vortex-config",
    "crates/vortex-registry",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
authors = ["SomaTech <engineering@somatech.lat>"]
license = "MIT"
description = "VORTEX High-Performance AI Workflow Engine"

[workspace.dependencies]
# Async Runtime
tokio = { version = "1.35", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Hashing
sha2 = "0.10"

# Incremental Computation
salsa = { version = "0.17.0-pre.2" }

# IPC
nix = { version = "0.27", features = ["fs", "socket", "mman"] }
memmap2 = "0.9"

# Concurrency
dashmap = "5.5"
parking_lot = "0.12"

# HTTP Server
axum = { version = "0.7", features = ["ws"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["trace", "cors"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error Handling
thiserror = "1.0"
anyhow = "1.0"

# UUID Generation
uuid = { version = "1.6", features = ["v4", "serde"] }

# Protobuf
prost = "0.12"
prost-types = "0.12"

# Telemetry
opentelemetry = "0.21"
opentelemetry-otlp = "0.14"

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "macros", "json", "chrono", "uuid"] }
sea-orm = { version = "0.12", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros"] }

# DLPack for Zero-Copy Tensors (CORRECTED VERSIONS)
dlpack-sys = "0.1.1"
ndarray = "0.15"
ndarray-rand = "0.14"
