[package]
name = "vortex-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Core engine for VORTEX-GEN 3.0"

[dependencies]
vortex-protocol = { path = "../vortex-protocol" }
vortex-telemetry = { path = "../vortex-telemetry" }
vortex-config = { path = "../vortex-config" }
vortex-mcp = { path = "../vortex-mcp" }
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }
jsonwebtoken = "9"
tokio-util = "0.7"

# Async Runtime
tokio.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true

# Hashing
sha2.workspace = true

# Incremental Computation
salsa.workspace = true

# Protobuf
prost.workspace = true

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "sqlite", "macros", "json", "chrono", "uuid"] }
sea-orm = { version = "0.12", features = ["sqlx-postgres", "sqlx-sqlite", "runtime-tokio-rustls", "macros"] }

# IPC - Unix Domain Sockets
nix.workspace = true
libc = "0.2"

# Shared Memory
memmap2.workspace = true

# DLPack for Zero-Copy Tensors
dlpack-sys.workspace = true
ndarray.workspace = true
ndarray-rand.workspace = true

# Concurrency
dashmap.workspace = true
parking_lot.workspace = true

# HTTP Server
axum.workspace = true
tower.workspace = true
tower-http.workspace = true

# Logging
tracing.workspace = true
tracing-subscriber.workspace = true

# Futures
futures-util = "0.3"

# Error Handling
thiserror.workspace = true
anyhow.workspace = true

# UUID Generation
uuid.workspace = true

# System Detection
num_cpus = "1.16"

[dev-dependencies]
criterion = "0.5"
tempfile = "3.9"

[lib]
crate-type = ["rlib"]
